apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-collector
spec:
  mode: deployment
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch: {}
      resource:
        attributes:
          # hint pro Loki: quais resource attributes viram labels do stream
          - action: insert
            key: loki.resource.labels
            value: "service.name, service.namespace, k8s.namespace.name, k8s.pod.name, k8s.deployment.name"

    exporters:
      debug:
        verbosity: detailed
      otlphttp/loki:
        endpoint: http://loki-gateway.obs.svc.cluster.local/otlp
        tls:
          insecure: true

    service:
      pipelines:
        logs:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [otlphttp/loki, debug]
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [debug]
      metrics:
        receivers: [otlp]
        processors: [batch]
        exporters: [debug]