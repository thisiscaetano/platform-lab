apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: hello-gitops-instrumentation
spec:
  exporter:
    # endpoint do seu OTel Collector (ajuste para o service dele)
    endpoint: http://otel-collector-collector.obs.svc.cluster.local:4318
  propagators:
    - tracecontext
    - baggage
  python:
    env:
      - name: OTEL_EXPORTER_OTLP_PROTOCOL
        value: "http/protobuf"
      - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
        value: "http://otel-collector-collector.obs.svc.cluster.local:4318/v1/traces"
      - name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
        value: "http://otel-collector-collector.obs.svc.cluster.local:4318/v1/metrics"
      - name: OTEL_EXPORTER_OTLP_LOGS_ENDPOINT
        value: "http://otel-collector-collector.obs.svc.cluster.local:4318/v1/logs"
      - name: OTEL_LOGS_EXPORTER
        value: "otlp"
      - name: OTEL_METRICS_EXPORTER
        value: "otlp"
      - name: OTEL_TRACES_EXPORTER
        value: "otlp"