apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hello-gitops-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secret-store
    kind: ClusterSecretStore
  target:
    name: hello-gitops-secret
    creationPolicy: Owner
  data:
    - secretKey: APP_SECRET_MESSAGE 
      remoteRef:
        key: hello-gitops/app-secret
        property: message
