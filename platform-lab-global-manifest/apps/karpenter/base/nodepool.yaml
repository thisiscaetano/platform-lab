apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: ondemand-pool
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: ondemand
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values:
           - amd64

        - key: kubernetes.io/os
          operator: In
          values: ["linux"]

        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]

        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - m5.xlarge
            - c5.xlarge
            - m5.2xlarge

        - key: karpenter.k8s.aws/instance-category
          operator: In
          values:
            - c
            - m
        - key: topology.kubernetes.io/zone
          operator: In
          values: 
            - us-east-1a
            - us-east-1b
            - us-east-1c

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
  limits:
    cpu: "1000"
    memory: 1000Gi