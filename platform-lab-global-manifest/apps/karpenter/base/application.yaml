apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
spec:
  project: default
  sources:
    - repoURL: public.ecr.aws/karpenter
      chart: karpenter
      targetRevision: "1.14.0"
      helm:
        values: |
          replicas: 1
          logLevel: debug 
          settings:
            clusterName: platform-lab
          serviceAccount:
            create: true
            name: karpenter
          nodeSelector:
            eks.amazonaws.com/nodegroup: example-6594c0c00d58453f81f48c94b9

          controller:
            env:
              - name: AWS_REGION
                value: "us-east-1"
            resources:
              requests:
                cpu: 250m
                memory: 256Mi
    - repoURL: git@github.com:thisiscaetano/platform-lab.git
      path: platform-lab-global-manifest/apps/karpenter/base
      targetRevision: HEAD
  destination:
    name: lab
    namespace: karpenter
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true