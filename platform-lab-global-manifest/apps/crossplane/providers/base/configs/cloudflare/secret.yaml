apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-lab-cloudflare
  namespace: upbound-system
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore

  target:
    name: platform-lab-cloudflare
    creationPolicy: Owner

  data:
    - secretKey: api_token
      remoteRef:
        key: platform-lab-cloudflare
        property: api_token